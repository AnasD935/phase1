name: Deploy Field Shift Frontend to Pages

on:
  push:
    branches:
      - master
    paths:
      - 'field-shift/frontend/**'
      - '.github/workflows/deploy-field-shift-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: field-shift/frontend/package-lock.json

      - name: Install dependencies
        working-directory: field-shift/frontend
        run: npm ci

      - name: Validate production API configuration
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "Missing repository/environment variable VITE_API_URL."
            echo "Set VITE_API_URL to the deployed FastAPI API base URL (for example: https://your-api.example.com/api)."
            exit 1
          fi
          case "${VITE_API_URL}" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "VITE_API_URL must be a public production URL, not localhost: ${VITE_API_URL}"
              exit 1
              ;;
          esac

      - name: Build frontend
        working-directory: field-shift/frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: field-shift/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
